[package]
name = "mmh3-output"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
webm = ["dep:shiguredo_libvpx", "dep:opus", "dep:rubato"]
mp4 = ["dep:rusty_aac"]

[dependencies]
mmh3-core = { path = "../mmh3-core" }
tempfile = "3"
rusty_aac = { version = "0.5", optional = true }
shiguredo_libvpx = { version = "2026.1.0", optional = true }
opus = { version = "0.4", optional = true }
rubato = { version = "0.16", optional = true }

[dev-dependencies]
serde_json = "1"
